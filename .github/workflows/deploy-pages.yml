name: Deploy static site to GitHub Pages

on:
  # Deploy only after the Test workflow succeeds for a push to main, so each
  # commit runs the tests once per Node version instead of twice.
  workflow_run:
    workflows: ["Test"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    # The Test run must have passed, and only a push to main deploys; a manual
    # dispatch skips that check.
    if: >
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_branch == 'main')
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # A workflow_run deploy must publish the commit the tests ran on.
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Configure Pages
        uses: actions/configure-pages@v5

      # Publish only the game itself, not node_modules, tests or config
      - name: Collect site files
        run: |
          mkdir _site
          cp -r index.html privacy.html accessibility.html manifest.json src styles images _site/

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      # The list comes from the repo (git ls-files), not from _site/, so a
      # file that was left out of the copy step above is still checked.
      - name: Check the live site
        env:
          SITE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          base="${SITE_URL%/}"
          missing=0
          while IFS= read -r file; do
            if ! curl --fail --silent --show-error --output /dev/null \
              --retry 5 --retry-delay 10 --retry-all-errors \
              "$base/$file"; then
              echo "::error::Missing from the live site: $file"
              missing=$((missing + 1))
            fi
          done < <(git ls-files | grep -E '^(manifest\.json|[^/]+\.(html|xml|txt)|(src|styles|images)/.+)$')
          if [ "$missing" -gt 0 ]; then
            echo "$missing file(s) missing from the live site"
            exit 1
          fi
